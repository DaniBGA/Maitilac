# Deploy al VPS cuando la CI pasa en main (docs/OPERACION.md):
#   1. compila la imagen y la publica en GHCR (ghcr.io/<usuario>/<repo>)
#   2. entra por SSH al VPS y actualiza el sitio (las migraciones corren al arrancar)
#
# Configuración en GitHub (Settings → Secrets and variables → Actions):
#   variable SITIO_URL        https://nuevo.<dominio> (después, el dominio definitivo)
#   secretos VPS_HOST, VPS_USER (deploy), VPS_SSH_KEY (clave privada sólo para el deploy)
#            y VPS_KNOWN_HOSTS (salida de: ssh-keyscan <ip del VPS>)
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      imagen: ${{ steps.nombre.outputs.imagen }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: nombre
        run: echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: SITIO_URL=${{ vars.SITIO_URL }}
          tags: |
            ${{ steps.nombre.outputs.imagen }}:latest
            ${{ steps.nombre.outputs.imagen }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  servidor:
    needs: imagen
    runs-on: ubuntu-24.04
    environment: produccion
    steps:
      - name: Actualizar el sitio en el VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy "$VPS_USER@$VPS_HOST" \
            'cd /srv/maitilac && docker compose pull app && docker compose up -d app && docker image prune -f'
